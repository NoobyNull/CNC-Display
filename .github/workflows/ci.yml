name: build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (model layer, no hardware)
        run: test/run_host_tests.sh
      - name: Desktop simulator builds (UI and model layers stay portable)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-dev
          make -C sim deps
          make -C sim -j"$(nproc)"

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # FW_TAG is the short hash of HEAD
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Panel firmware builds
        run: pio run -e crowadv
