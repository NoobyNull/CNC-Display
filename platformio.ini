; CNC Console — Waveshare ESP32-S3-Touch-LCD-7B (ESP32-S3-WROOM-1-N16R8,
; 1024x600 RGB, GT911 touch, CH32V003 I2C io-extender).
; FluidNC link: UART2 @ 1 Mbaud on GPIO 43/44, wired to the board's UART
; terminal (the PH2.0 header, not the USB-UART Type-C — a mux switch picks one).
; Flashing and the debug console both ride the *other* Type-C, the native
; USB-Serial-JTAG on GPIO 19/20, which is independent of 43/44.

[platformio]
default_envs = ws7b

[env:ws7b]
; espressif32@6.9.0 (arduino-esp32 2.0.17 / IDF 4.4) fails to add octal PSRAM to
; the heap — "External RAM could not be added to heap!" then an abort loop at
; cpu_start. The N16R8 module here has the same OPI PSRAM the CrowPanel had, so
; the pioarduino platform is still mandatory.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_src_filter = +<*>
lib_deps =
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.2.13
    lovyan03/LovyanGFX@^1.1.8
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/MitchBradley/json-streaming-parser#charp-1.0.2
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; USB_MODE=1 selects the hardware USB-Serial-JTAG peripheral (GPIO 19/20)
    ; and CDC_ON_BOOT points Serial at it. That is the console *and* the flashing
    ; port, so 43/44 stay on the machine link permanently.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DJSP_USE_CHARP
    -DE4_POS_T
    -DVERBATIM_GCODE_MODES
    -DFNC_BAUD=1000000
    -I src
    -I src/hw

[env:native]
platform = native
; PlatformIO does not build src/ into test binaries unless told to.
test_build_src = yes
build_src_filter = +<model/gcode_path.cpp> +<model/offsets.cpp> +<model/console_log.cpp> +<transport/xmodem_rx.cpp> +<transport/xmodem_tx.cpp> +<model/vibration.cpp> +<model/screensaver.cpp> +<model/calibration.cpp>
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I src
test_framework = unity
