; CNC Console — Elecrow CrowPanel Advance 7.0 V1.4 (ESP32-S3-WROOM-1-N16R8,
; 800x480 RGB, GT911 touch, STC8H1K28 housekeeping MCU on I2C 0x30).
; FluidNC link: UART2 peripheral @ 1 Mbaud on GPIO 43/44 via the UART0-IN
; connector. Those are also the CH340K/USB pins — flashing rides the ROM
; bootloader there, and the debug console exists only while the Setup
; "Wired UART" toggle is OFF (see main.cpp).

[platformio]
default_envs = crowadv

[env:crowadv]
; espressif32@6.9.0 (arduino-esp32 2.0.17 / IDF 4.4) fails to add octal PSRAM to
; the heap — "External RAM could not be added to heap!" then an abort loop at
; cpu_start. The N16R8 module here has the same OPI PSRAM the CrowPanel had, so
; the pioarduino platform is still mandatory.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; src/sim is the desktop simulator ([env:sim]) and must never reach the panel
; build — it defines its own main() and stubs out every hw/ function.
build_src_filter = +<*> -<sim/>
lib_deps =
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.2.13
    lovyan03/LovyanGFX@^1.1.8
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/MitchBradley/json-streaming-parser#charp-1.0.2
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; No native USB on this board — the Type-C is a CH340K on UART0, so Serial
    ; must be the UART0 HardwareSerial, not a CDC device.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DJSP_USE_CHARP
    -DE4_POS_T
    -DVERBATIM_GCODE_MODES
    -DFNC_BAUD=1000000
    ; Build identity for the Setup page: the git hash this image was built
    ; from. Proof on the glass of which firmware is actually running — the
    ; only way to verify an OTA landed.
    !echo '-DFW_TAG=\"'$(git rev-parse --short HEAD)'\"'
    -I src
    -I src/hw

; Desktop simulator: the real src/ui and src/model drawn by LVGL into an SDL
; window, with src/sim standing in for the panel, the GT911 and the controller.
; Same lv_conf.h and same fonts as the firmware, so layout seen here is layout
; you get on the glass. Needs SDL2 headers (pkg-config sdl2).
;   pio run -e sim && .pio/build/sim/program
;   .pio/build/sim/program --shot /tmp/ui.bmp     (headless, one frame)
[env:sim]
platform = native
build_src_filter = +<ui/> +<model/> +<sim/> +<transport/xmodem_rx.cpp>
build_flags =
    -std=gnu++17
    -DSIMULATOR
    -DLV_CONF_INCLUDE_SIMPLE
    ; Must match the firmware: these change pos_t and the parser's mode
    ; handling, so a mismatch would render different numbers than the panel.
    -DE4_POS_T
    -DVERBATIM_GCODE_MODES
    -DFW_TAG=\"sim\"
    ; src/sim first: it supplies the Arduino.h and Preferences.h stand-ins.
    -I src/sim
    -I src
    -I src/hw
    !pkg-config --cflags --libs sdl2
lib_deps =
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9

[env:native]
platform = native
; PlatformIO does not build src/ into test binaries unless told to.
test_build_src = yes
build_src_filter = +<model/gcode_stats.cpp> +<model/offsets.cpp> +<model/console_log.cpp> +<model/fnc_codes.cpp> +<transport/xmodem_rx.cpp> +<model/vibration.cpp> +<model/screensaver.cpp> +<model/calibration.cpp> +<model/sendq.cpp> +<model/caps.cpp> +<model/fnc_settings.cpp> +<model/filelist.cpp> +<model/homed.cpp> +<model/motors.cpp>
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DE4_POS_T
    -I src
test_framework = unity
; caps/filelist/fnc_settings reach the controller through FluidNCModel.h, which
; includes GrblParserC.h for pos_t. Only the header is wanted here — the tests
; stub send_line() themselves — but the dependency has to be fetched to be
; included, so it is declared the same way the firmware env declares it.
lib_deps =
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9
