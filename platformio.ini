; CNC Console — Elecrow CrowPanel Advance 7.0" (ESP32-S3, 800x480 RGB, GT911)
; FluidNC link: UART2 @ 1 Mbaud on GPIO 17 (TX) / 18 (RX)

[platformio]
default_envs = crowpanel

[env:crowpanel]
; Must match Elcrow-Display-hotkeys. espressif32@6.9.0 (arduino-esp32 2.0.17 /
; IDF 4.4) fails to add this board's OPI PSRAM to the heap — "External RAM could
; not be added to heap!" followed by an abort loop at cpu_start. FluidDial pins
; 6.9.0, but it targets an M5 Stamp S3 and a plain-ESP32 CYD, neither of which
; has OPI PSRAM, so that pin does not carry over.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_4mb.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_src_filter = +<*>
lib_deps =
    lovyan03/LovyanGFX@^1.1.8
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/MitchBradley/json-streaming-parser#charp-1.0.2
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DJSP_USE_CHARP
    -DE4_POS_T
    -DVERBATIM_GCODE_MODES
    -DFNC_BAUD=1000000
    -I src
    -I src/hw

[env:native]
platform = native
; PlatformIO does not build src/ into test binaries unless told to.
test_build_src = yes
build_src_filter = +<model/gcode_path.cpp> +<model/offsets.cpp> +<model/console_log.cpp> +<transport/xmodem_rx.cpp> +<transport/xmodem_tx.cpp>
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I src
test_framework = unity
