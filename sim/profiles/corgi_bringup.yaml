# FluidNC config — Corgi — MOTION BRING-UP, no limits / no homing
#
# DERIVED FROM THE LIVE CONFIG pulled off the Corgi at 192.168.0.5 on
# 2026-08-25, not from corgi_config.yaml on the desktop. The desktop file
# disagrees with the running machine on the VFD driver, the RS485 pins and
# baud, every steps_per_mm, and two pin polarities. The running machine wins.
#
# Removed from the live config: every limit pin, every homing cycle,
# homing_runs, must_home and check_limits. hard_limits forced false.
# control:, coolant:, macros: and user_outputs: were ALREADY all NO_PIN /
# empty on the live machine — there was no e-stop, door, macro or feed-hold
# input configured to remove.
#
# Added: the A axis on Motor CH5. Its pins are NOT VERIFIED — see the note
# on that axis before energising the driver.
#
# THE HARDWARE KILL IS UNCHANGED AND IS NOW THE ONLY STOP: the two NC blocks
# on the master-relay 5V and the VFD ext-stop. Those are wired, not
# configured; nothing in this file touches them.
#
# Consequences:
#   - $H errors. No homing cycles exist.
#   - Y1/Y2 do not auto-square. The gantry keeps whatever racking it powers
#     up with, and nothing will ever correct it.
#   - Nothing stops an axis at the end of travel. soft_limits need a homed
#     origin and hard_limits have no switches. Jog conservatively.

board: Corgi
name: Corgi X-Y1Y2-Z-A bring-up (no limits, no homing)
meta: 2026-08-25
stepping:
  engine: I2S_STREAM
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 1
  segments: 12

uart1:
  txd_pin: gpio.15
  rxd_pin: gpio.16
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 19200
  mode: 8N1
  passthrough_baud: 0
  passthrough_mode: 8E1

uart2:
  txd_pin: gpio.27
  rxd_pin: gpio.25
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 1000000
  mode: 8N1
  passthrough_baud: 1000000
  passthrough_mode: 8N1

uart_channel2:
  report_interval_ms: 75
  uart_num: 2
  message_level: Verbose

i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17
  min_pulse_us: 2
  oe_pin: NO_PIN

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

kinematics:
  Cartesian:

axes:
  shared_stepper_disable_pin: NO_PIN
  shared_stepper_reset_pin: NO_PIN
  X:
    steps_per_mm: 39.895000
    max_rate_mm_per_min: 5000.000000
    acceleration_mm_per_sec2: 350.000000
    max_travel_mm: 1000.000000
    soft_limits: false
    idle_disable: true

    motor0:
      hard_limits: false
      pulloff_mm: 1.000000
      standard_stepper:
        step_pin: I2SO.2
        direction_pin: I2SO.1
        disable_pin: I2SO.0

  Y:
    steps_per_mm: 40.000000
    max_rate_mm_per_min: 5000.000000
    acceleration_mm_per_sec2: 350.000000
    max_travel_mm: 800.000000
    soft_limits: false
    idle_disable: true

    motor0:
      hard_limits: false
      pulloff_mm: 1.000000
      standard_stepper:
        step_pin: I2SO.5
        direction_pin: 'I2SO.4:low'
        disable_pin: I2SO.7

    motor1:
      hard_limits: false
      pulloff_mm: 1.000000
      standard_stepper:
        step_pin: I2SO.10
        direction_pin: I2SO.9
        disable_pin: I2SO.8

  Z:
    steps_per_mm: 800.000000
    max_rate_mm_per_min: 5000.000000
    acceleration_mm_per_sec2: 350.000000
    max_travel_mm: 100.000000
    soft_limits: false
    idle_disable: true

    motor0:
      hard_limits: false
      pulloff_mm: 1.000000
      standard_stepper:
        step_pin: I2SO.13
        direction_pin: I2SO.12
        disable_pin: I2SO.15

  A:
    # NEW — this axis does not exist in the live config, so nothing here has
    # ever driven hardware.
    #
    # UNVERIFIED: Motor CH5 = I2SO.18/17/16 comes from the 6-Pack standard
    # mapping, the same source that produced CH1-CH4. Those four match the
    # running machine exactly, which is the only reason to trust CH5 — it is
    # still an inference. Confirm against the Corgi silkscreen before power.
    #
    # steps_per_mm 8.889 assumes degree mode at 3200 ppr, 1:1. Wrong for any
    # other ratio.
    steps_per_mm: 8.889000
    max_rate_mm_per_min: 10000.000000
    acceleration_mm_per_sec2: 200.000000
    max_travel_mm: 360.000000
    soft_limits: false
    idle_disable: true

    motor0:
      hard_limits: false
      pulloff_mm: 1.000000
      standard_stepper:
        step_pin: I2SO.18
        direction_pin: I2SO.17
        disable_pin: I2SO.16

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN
  homing_button_pin: NO_PIN

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: false
  hard_stop: false
  probe_hard_limit: false

macros:
  startup_line0:
  startup_line1:
  Macro0:
  Macro1:
  Macro2:
  Macro3:
  after_homing:
  after_reset:
  after_unlock:

start:
  must_home: false
  deactivate_parking: false
  check_limits: false

parking:
  enable: false
  axis: Z
  target_mpos_mm: -5.000000
  rate_mm_per_min: 800.000000
  pullout_distance_mm: 5.000000
  pullout_rate_mm_per_min: 250.000000

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

user_inputs:
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN

status_outputs:
  report_interval_ms: 500
  idle_pin: NO_PIN
  run_pin: NO_PIN
  hold_pin: NO_PIN
  alarm_pin: NO_PIN
  door_pin: NO_PIN

H100:
  uart_num: 1
  modbus_id: 1
  debug: 2
  poll_ms: 250
  retries: 5
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.00% 240=1.00% 24000=100.00%
  off_on_alarm: false
  atc:
  m6_macro:
  s0_with_disable: false
  disable_with_s0: false
  model: H100
  min_RPM: 3000
  max_RPM: 24000
  cw_cmd: 05 00 49 ff 00 > echo
  ccw_cmd: 05 00 4A ff 00 > echo
  off_cmd: 05 00 4B ff 00 > echo
  set_rpm_cmd: 06 02 01 rpm*10/60 > echo
  get_min_rpm_cmd: 03 00 0B 00 01 > 03 02 minrpm*60/10
  get_max_rpm_cmd: 03 00 05 00 01 > 03 02 maxrpm*60/10
  get_rpm_cmd: 04 00 00 00 02 > 04 04 rpm*60/10 ignore

arc_tolerance_mm: 0.002000
junction_deviation_mm: 0.010000
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16
